#:schema ../../../../../schema/interface.schema.json
# As agreed in the flow review: currency is optional.
interface   = "payment-request"
title       = "Payment request"
kind        = "api-request"
owner       = "Payments team"
status      = "proposed"
description = "What the payments service needs to take payment for an order."

[[field]]
name     = "currency"
type     = "string"
required = false
description = "ISO 4217 currency code"

[[field]]
name     = "customsValue"
type     = "number"
required = false

[[field]]
name     = "discountAmount"
type     = "number"
required = false

[[field]]
name     = "freeShipping"
type     = "boolean"
required = false

[[field]]
name     = "loyaltyTier"
type     = "string"
required = false

[[field]]
name     = "netAmount"
type     = "number"
required = true

[[field]]
name     = "salesTax"
type     = "number"
required = true

[[field]]
name     = "shippingCost"
type     = "number"
required = false

[[field]]
name     = "shippingMethod"
type     = "string"
required = false

[[field]]
name     = "subtotal"
type     = "number"
required = true

[[field]]
name     = "totalAmount"
type     = "number"
required = true
