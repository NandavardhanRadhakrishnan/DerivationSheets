#:schema ../../schema/sheet.schema.json
sheet   = "premium-calculation"
version = 1
title   = "Health policy premium"

# ---------- From the request ----------

[[row]]
id     = "dob"
name   = "Date of birth"
source = "request.applicant.dob"
type   = "date"

[[row]]
id     = "city"
name   = "City"
source = "request.applicant.city"
type   = "string"

[[row]]
id     = "is_smoker"
name   = "Smoker"
source = "request.applicant.isSmoker"
type   = "boolean"

[[row]]
id     = "has_ped"
name   = "Has pre-existing disease"
source = "request.medical.hasPED"
type   = "boolean"

[[row]]
id     = "plan"
name   = "Plan"
source = "request.policy.planCode"
type   = "string"

  [row.send]
  field = "planCode"
  usage = "R"

[[row]]
id     = "sum_insured"
name   = "Sum insured"
source = "request.policy.sumInsured"
type   = "number"

  [row.send]
  field = "sumInsured"
  usage = "R"

# ---------- From context and config ----------

[[row]]
id     = "request_time"
name   = "Request time"
source = "context.request_time"
type   = "datetime"

[[row]]
id     = "gst_rate"
name   = "GST rate"
source = "config.tax.gst_rate"
type   = "number"

# ---------- Derived ----------

[[row]]
id      = "age"
name    = "Age"
uses    = ["dob", "request_time"]
formula = "years_between(dob, request_time)"

  [[row.reject]]
  when    = "age > 65"
  code    = "AGE_LIMIT"
  message = "Applicant is over 65"

[[row]]
id     = "zone"
name   = "Zone"
uses   = ["city"]
lookup = { from = "db.city_zones", key = ["city"] }
values_file = "data/city_zones.csv"

[[row]]
id   = "risk_class"
name = "Risk class"
uses = ["is_smoker", "has_ped"]

  [row.table]
  columns = ["is_smoker", "has_ped", "=>"]
  rows = [
    [false, false, "Standard"],
    [false, true,  "Elevated"],
    [true,  false, "Elevated"],
    [true,  true,  "High"],
  ]

  [row.send]
  field = "riskClassCode"
  usage = "R"
  map   = { Standard = "STD", Elevated = "ELV", High = "HIGH" }

[[row]]
id     = "waiting_period"
name   = "Waiting period"
uses   = ["has_ped", "plan"]
lookup = { from = "db.plan_ped_waiting", key = ["plan"] }
values_file = "data/plan_ped_waiting.csv"

  [row.send]
  field     = "waitingPeriodMonths"
  usage     = "S"
  when      = "has_ped == true"
  otherwise = "do-not-send"

[[row]]
id     = "base_premium"
name   = "Base premium"
uses   = ["plan", "age", "zone", "sum_insured"]
lookup = { from = "db.plan_rates", key = ["plan", "age", "zone", "sum_insured"] }
values_file = "data/plan_rates.csv"

[[row]]
id     = "loading"
name   = "Loading"
uses   = ["risk_class"]
lookup = { from = "config.pricing.loading", key = ["risk_class"] }
values = { Standard = 0, Elevated = 0.15, High = 0.35 }

[[row]]
id   = "medical_check"
name = "Medical check"
uses = ["age", "risk_class"]

  [row.table]
  hit_policy = "first"
  columns = ["age", "risk_class", "=>"]
  rows = [
    [">= 46", "-",    true],
    ["-",     "High", true],
    ["-",     "-",    false],
  ]

  [row.send]
  field = "underwritingType"
  usage = "R"
  map   = { true = "MANUAL", false = "STP" }

[[row]]
id      = "net_premium"
name    = "Net premium"
uses    = ["base_premium", "loading"]
formula = "round(base_premium * (1.0 + loading))"

  [row.send]
  field = "netPremium"
  usage = "R"

[[row]]
id      = "gst"
name    = "GST"
uses    = ["net_premium", "gst_rate"]
formula = "round(net_premium * gst_rate)"

  [row.send]
  field = "gstAmount"
  usage = "R"

[[row]]
id      = "total_payable"
name    = "Total payable"
uses    = ["net_premium", "gst"]
formula = "net_premium + gst"

  [row.send]
  field = "totalPayable"
  usage = "R"
