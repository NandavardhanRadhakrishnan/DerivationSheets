#:schema ../../schema/sheet.schema.json
sheet   = "order-checkout"
version = 1
title   = "Online order checkout"

# ---------- From the request ----------

[[row]]
id     = "signup_date"
name   = "Signup date"
source = "request.customer.signupDate"
type   = "date"

[[row]]
id     = "is_member"
name   = "Member"
source = "request.customer.isMember"
type   = "boolean"

[[row]]
id     = "country"
name   = "Destination country"
source = "request.shipping.country"
type   = "string"

[[row]]
id     = "shipping_method"
name   = "Shipping method"
source = "request.shipping.method"
type   = "string"

  [row.send]
  field = "shippingMethod"
  usage = "R"

[[row]]
id     = "weight_kg"
name   = "Parcel weight (kg)"
source = "request.order.weightKg"
type   = "number"

[[row]]
id     = "subtotal"
name   = "Subtotal"
source = "request.order.subtotal"
type   = "number"

  [row.send]
  field = "subtotal"
  usage = "R"

# ---------- From context and config ----------

[[row]]
id     = "request_time"
name   = "Request time"
source = "context.request_time"
type   = "datetime"

[[row]]
id     = "sales_tax_rate"
name   = "Sales tax rate"
source = "config.tax.sales_tax_rate"
type   = "number"

# ---------- Derived ----------

[[row]]
id      = "customer_years"
name    = "Years as customer"
uses    = ["signup_date", "request_time"]
formula = "years_between(signup_date, request_time)"

[[row]]
id     = "zone"
name   = "Shipping zone"
uses   = ["country"]
lookup = { from = "db.shipping_zones", key = ["country"] }
values_file = "data/shipping_zones.csv"

  [[row.reject]]
  when    = "zone == \"NONE\""
  code    = "DESTINATION_NOT_SERVED"
  message = "We do not ship to this country"

[[row]]
id   = "loyalty_tier"
name = "Loyalty tier"
uses = ["is_member", "customer_years"]

  [row.table]
  columns = ["is_member", "customer_years", "=>"]
  rows = [
    [false, "< 2",  "Standard"],
    [false, ">= 2", "Silver"],
    [true,  "< 2",  "Silver"],
    [true,  ">= 2", "Gold"],
  ]

  [row.send]
  field = "loyaltyTier"
  usage = "R"
  map   = { Standard = "STD", Silver = "SLV", Gold = "GLD" }

[[row]]
id     = "discount_rate"
name   = "Discount rate"
uses   = ["loyalty_tier"]
lookup = { from = "config.pricing.discount", key = ["loyalty_tier"] }
values = { Standard = 0, Silver = 0.05, Gold = 0.10 }

[[row]]
id      = "discount"
name    = "Discount"
uses    = ["subtotal", "discount_rate"]
formula = "round(subtotal * discount_rate)"

  [row.send]
  field = "discountAmount"
  usage = "R"

[[row]]
id   = "free_shipping"
name = "Free shipping"
uses = ["subtotal", "loyalty_tier"]

  [row.table]
  hit_policy = "first"
  columns = ["subtotal", "loyalty_tier", "=>"]
  rows = [
    [">= 100", "-",    true],
    ["-",      "Gold", true],
    ["-",      "-",    false],
  ]

  [row.send]
  field = "freeShipping"
  usage = "R"

[[row]]
id     = "shipping_fee"
name   = "Shipping fee"
uses   = ["zone", "shipping_method", "weight_kg"]
lookup = { from = "db.shipping_rates", key = ["zone", "shipping_method", "weight_kg"] }
values_file = "data/shipping_rates.csv"

[[row]]
id      = "shipping_cost"
name    = "Shipping cost"
uses    = ["free_shipping", "shipping_fee"]
formula = "free_shipping ? 0 : shipping_fee"

  [row.send]
  field = "shippingCost"
  usage = "R"

[[row]]
id      = "customs_value"
name    = "Customs value"
uses    = ["subtotal", "discount", "zone"]
formula = "subtotal - discount"

  [row.send]
  field     = "customsValue"
  usage     = "S"
  when      = "zone != \"DOMESTIC\""
  otherwise = "do-not-send"

[[row]]
id      = "net_amount"
name    = "Net amount"
uses    = ["subtotal", "discount", "shipping_cost"]
formula = "subtotal - discount + shipping_cost"

  [row.send]
  field = "netAmount"
  usage = "R"

[[row]]
id      = "sales_tax"
name    = "Sales tax"
uses    = ["net_amount", "sales_tax_rate"]
formula = "round(net_amount * sales_tax_rate)"

  [row.send]
  field = "salesTax"
  usage = "R"

[[row]]
id      = "total"
name    = "Order total"
uses    = ["net_amount", "sales_tax"]
formula = "net_amount + sales_tax"

  [row.send]
  field = "totalAmount"
  usage = "R"
