#:schema ../../schema/flow.schema.json
flow    = "checkout-to-payment"
version = 1
title   = "Checkout to payment"

# The end-to-end derivation the product manager wrote: from the checkout
# request to the payment request, ignoring who computes what.
sheet = "../../specs/order-checkout"

# Interfaces owned by other teams can live in their own repositories, named
# by the registry or here, and referred to as "alias:path". Here the shipping
# contracts are a local folder; a team repository looks like:
#   shipping = { git = "https://github.com/example/shipping-service.git", dir = "sheets" }
[sources]
shipping = { path = "../../interfaces/shipping" }

[input]
interface = "../../interfaces/storefront/checkout-request.toml"

# 1. The storefront publishes an event. Whatever the Orders team needs
#    later must be on the topic.
[[stage]]
kind      = "handoff"
interface = "../../interfaces/orders/order-placed.toml"
producer  = "Storefront team"
computes  = ["customer_years", "loyalty_tier"]

# 2. The Orders team asks the Shipping team for a quote. The Orders team
#    keeps its own state across the call; the Shipping team only sees the
#    request.
[[stage]]
id       = "shipping-quote"
kind     = "call"
caller   = "Orders team"
computes = ["zone", "discount_rate", "discount", "free_shipping"]
callee   = "Shipping team"
callee_computes = ["shipping_fee"]

  [stage.request]
  interface = "shipping:quote-request.toml"

  [stage.response]
  interface = "shipping:quote-response.toml"
  carries   = { fee = "shipping_fee" }

# 3. The Orders team builds the payment request.
[output]
interface = "../../interfaces/payments/payment-request.toml"
producer  = "Orders team"
computes  = ["shipping_cost", "customs_value", "net_amount", "sales_tax", "total"]
